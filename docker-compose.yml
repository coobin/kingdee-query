services:
  kingdee-query-hub:
    image: kingdee-query-hub:latest
    build: .
    container_name: kingdee-query-hub
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8092}:8092"
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/app/data
    networks:
      - query_net

networks:
  query_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.16.240.0/24}
