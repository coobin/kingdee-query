<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#123f31">
  <title>超级管理员设置 · Kingdee Query Hub</title>
  <link rel="stylesheet" href="/auth.css?v=20260813-3">
</head>
<body class="admin-page">
  <header class="admin-topbar">
    <a class="auth-brand" href="/"><span class="auth-mark" aria-hidden="true"><i></i><i></i><i></i></span><span><strong>KINGDEE QUERY HUB</strong><small>超级管理员设置</small></span></a>
    <nav><a href="/">数据查询台</a><button id="logout-button" type="button">退出管理员，使用 SSO</button></nav>
  </header>

  <main class="admin-shell">
    <section class="admin-heading">
      <div><p class="auth-eyebrow">ACCESS LEDGER · 查询权限定册</p><h1>把数据交给<em>该看到的人。</em></h1><p>模块名单直接匹配员工的金蝶用户名。每个模块名单为空时，所有已登录员工都可以查看。</p></div>
      <div class="admin-identity"><span>当前超级管理员</span><strong id="current-admin">读取中</strong></div>
    </section>

    <section class="settings-section" aria-labelledby="module-title">
      <div class="section-heading"><div><p class="auth-eyebrow">MODULE ACCESS</p><h2 id="module-title">模块查看人员</h2></div><button class="primary-action" id="save-access" type="button">保存模块权限</button></div>
      <div class="module-explainer"><span class="access-state open">空白</span><p>模块对所有已登录员工开放</p><span class="access-state restricted">有名单</span><p>只匹配名单中的金蝶用户；超级管理员始终可见</p></div>
      <div class="module-grid" id="module-grid" aria-live="polite"></div>
      <div class="admin-message" id="access-message" role="status" hidden></div>
    </section>

    <section class="settings-section" aria-labelledby="admins-title">
      <div class="section-heading"><div><p class="auth-eyebrow">SUPER ADMINS</p><h2 id="admins-title">超级管理员用户</h2></div><span class="read-only-badge">至少保留 1 人</span></div>
      <div class="admin-list" id="admin-list" aria-live="polite"></div>

      <form class="create-admin" id="create-admin-form">
        <div class="create-admin-heading"><strong>新增超级管理员</strong><span>新用户创建后立即可以从 /login 登录</span></div>
        <div class="admin-fields">
          <label><span>登录用户名</span><input name="username" type="text" minlength="2" maxlength="64" autocomplete="off" required></label>
          <label><span>显示名称</span><input name="displayName" type="text" maxlength="100" autocomplete="off" placeholder="例如：财务管理员"></label>
          <label><span>金蝶账号（可选）</span><input name="kingdeeUsername" type="text" maxlength="100" autocomplete="off" placeholder="需要在查询台查数据时填写"></label>
          <label><span>初始密码</span><input name="password" type="password" minlength="10" maxlength="200" autocomplete="new-password" required></label>
        </div>
        <div class="admin-form-footer"><div class="admin-message" id="admin-message" role="status" hidden></div><button class="primary-action" type="submit">新增超级管理员</button></div>
      </form>
    </section>
  </main>
  <script src="/admin.js?v=20260813-2" defer></script>
</body>
</html>
