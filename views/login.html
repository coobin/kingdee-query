<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#123f31">
  <title>超级管理员登录 · Kingdee Query Hub</title>
  <link rel="stylesheet" href="/auth.css?v=20260813-2">
</head>
<body class="auth-page">
  <main class="login-shell">
    <section class="login-intro" aria-labelledby="login-title">
      <a class="auth-brand" href="/"><span class="auth-mark" aria-hidden="true"><i></i><i></i><i></i></span><span><strong>KINGDEE QUERY HUB</strong><small>金蝶数据查询台</small></span></a>
      <p class="auth-eyebrow">ADMINISTRATIVE ACCESS · 独立管理入口</p>
      <h1 id="login-title">用一把单独的钥匙，<br><em>管理查询边界。</em></h1>
      <p class="auth-lede">此入口仅供超级管理员使用。员工日常查询仍使用原有 SSO，二者互不替代。</p>
      <div class="security-note"><strong>密码不会以明文保存</strong><span>登录会话使用 HttpOnly Cookie，并限制连续失败次数。</span></div>
    </section>

    <section class="login-card" aria-labelledby="form-title">
      <div class="ledger-edge" aria-hidden="true"></div>
      <p class="auth-eyebrow">SUPER ADMIN / LOGIN</p>
      <h2 id="form-title">超级管理员登录</h2>
      <form id="login-form">
        <label><span>用户名</span><input name="username" type="text" minlength="2" maxlength="64" autocomplete="username" required autofocus></label>
        <label><span>密码</span><input name="password" type="password" minlength="10" maxlength="200" autocomplete="current-password" required></label>
        <div class="auth-error" id="login-error" role="alert" hidden></div>
        <button type="submit"><span>进入管理设置</span><span aria-hidden="true">→</span></button>
      </form>
      <a class="back-link" href="/">返回数据查询台</a>
    </section>
  </main>
  <script src="/login.js?v=20260813-1" defer></script>
</body>
</html>
